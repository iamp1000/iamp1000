name: Generate Contribution Arcade

on:
  push:
    paths:
      - ".github/workflows/contribution-arcade.yml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Prepare output directory
        run: mkdir -p assets

      - name: Generate custom arcade animation
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: "assets/contribution-arcade.gif"
          strategy: "random"
          fps: 30
          no-commit: true

      - name: Commit generated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-arcade.gif
          git diff --staged --quiet || git commit -m "chore: update contribution arcade"
          git push
